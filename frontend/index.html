<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Transcript Downloader</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="app">
    <header>
      <h1>YouTube Transcript Tool</h1>
    </header>

    <main>
      <div id="main-area">

        <!-- Single command bar -->
        <div class="input-row">
          <select id="favorites-select" aria-label="Favorites">
            <option value="">★ Favorites…</option>
          </select>
          <button id="rename-fav-btn" class="icon-btn" type="button" title="Rename favorite" disabled>✎</button>
          <button id="delete-fav-btn" class="icon-btn" type="button" title="Delete favorite" disabled>🗑</button>
          <input id="url-input" type="text"
                 placeholder="Paste YouTube URL (video, playlist, or channel)">
          <button id="fetch-btn">Fetch</button>
          <button id="save-fav-btn" class="icon-btn" type="button" title="Save to favorites" disabled>☆</button>
          <input id="fav-name-input" type="text" class="hidden"
                 placeholder="Favorite name" aria-label="Favorite name">
          <button id="fav-name-confirm" type="button" class="hidden">Save</button>
          <span id="fetched-chip" class="status-chip"></span>
          <span id="dates-chip" class="status-chip">
            <span id="dates-chip-text"></span>
            <button id="dates-stop-btn" class="chip-stop">✕</button>
          </span>
          <input id="output-folder" type="text"
                 placeholder="e.g. ~/Downloads/transcripts"
                 aria-label="Output folder">
          <button id="browse-btn" type="button">Browse</button>
          <button id="open-folder-btn" type="button" title="Open in Finder">Open in Finder</button>
          <button id="copy-path-btn" type="button" title="Copy path">Copy path</button>
          <select id="browser-select" aria-label="Cookies from browser">
            <option value="">None</option>
            <option value="chrome" selected>Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="safari">Safari</option>
            <option value="edge">Edge</option>
            <option value="brave">Brave</option>
            <option value="chromium">Chromium</option>
          </select>
        </div>

        <!-- Video table -->
        <div id="table-wrapper">
          <div id="empty-state">Paste a URL above and click Fetch</div>
          <table id="video-table" class="hidden">
            <thead>
              <tr>
                <th class="col-check">
                  <input type="checkbox" id="select-all" title="Select all">
                </th>
                <th class="col-title" data-sort-col="title" data-label="Title">Title</th>
                <th class="col-date" data-sort-col="upload_date" data-label="Date">Date</th>
                <th class="col-channel" data-sort-col="channel" data-label="Channel">Channel</th>
                <th class="col-duration" data-sort-col="duration" data-label="Duration">Duration</th>
                <th class="col-status">Status</th>
              </tr>
            </thead>
            <tbody id="video-tbody"></tbody>
          </table>
        </div>

        <!-- Bottom action bar -->
        <div id="bottom-bar" class="hidden">
          <span id="selection-count">0 selected</span>
          <div class="bar-actions">
            <button id="pause-btn" type="button" class="hidden">⏸ Pause</button>
            <button id="resume-btn" type="button" class="hidden">▶ Resume</button>
            <button id="cancel-btn" type="button" class="hidden">✕ Cancel</button>
            <button id="restart-btn" type="button" class="hidden">↻ Restart</button>
            <button id="download-btn" disabled>↓ Download Selected</button>
          </div>
        </div>

      </div>

      <!-- Metadata field side panel -->
      <aside id="metadata-panel">
        <h2>Download</h2>
        <div id="download-types">
          <label class="field-label"><input type="checkbox" id="dl-transcript" checked> Transcript</label>
          <label class="field-label"><input type="checkbox" id="dl-audio"> Audio</label>
        </div>
        <h2>Metadata Fields</h2>
        <p class="panel-subtitle">Included in metadata.json</p>
        <div id="fields-list"></div>
      </aside>
    </main>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
